<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To Do</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>To Do</h1>

    <form id="new-todo-form" class="new-todo">
      <input
        id="new-todo-input"
        type="text"
        placeholder="What needs to be done?"
        autocomplete="off"
        maxlength="200"
        aria-label="New task"
      />
      <button type="submit">Add</button>
    </form>

    <ul id="todo-list" class="todo-list"></ul>

    <p id="empty-state" class="empty-state">No tasks here. Add one above!</p>

    <footer id="footer" class="footer">
      <span id="count"></span>
      <div class="filters" role="group" aria-label="Filter tasks">
        <button type="button" data-filter="all" class="active">All</button>
        <button type="button" data-filter="active">Active</button>
        <button type="button" data-filter="completed">Completed</button>
      </div>
      <button type="button" id="clear-completed" class="link-button">Clear completed</button>
    </footer>

    <p class="hint">Double-click a task to edit it.</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
